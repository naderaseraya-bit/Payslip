<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سجل الحضور</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>
// أيقونة + manifest داخل الملف نفسه
(function(){
  var c=document.createElement('canvas');c.width=c.height=512;var x=c.getContext('2d');
  x.fillStyle='#0f172a';x.fillRect(0,0,512,512);
  x.strokeStyle='#38bdf8';x.lineWidth=20;x.lineJoin='round';x.strokeRect(112,112,288,288);
  x.strokeStyle='#22c55e';x.lineWidth=30;x.lineCap='round';x.beginPath();x.moveTo(185,265);x.lineTo(235,318);x.lineTo(340,205);x.stroke();
  var icon=c.toDataURL('image/png');
  var m={name:'سجل الحضور',short_name:'الحضور',start_url:location.href.split('#')[0],scope:location.href.split('#')[0].replace(/[^\/]*$/,''),display:'standalone',orientation:'portrait',background_color:'#0f172a',theme_color:'#0f172a',lang:'ar',dir:'rtl',icons:[{src:icon,sizes:'512x512',type:'image/png',purpose:'any'}]};
  var l=document.createElement('link');l.rel='manifest';l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(l);
  var a=document.createElement('link');a.rel='apple-touch-icon';a.href=icon;document.head.appendChild(a);
})();
</script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--ok:#22c55e;--no:#ef4444;--lv:#f59e0b;--ac:#38bdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:16px 0 8px;color:var(--ac)}
.login{min-height:90vh;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}
input[type=text],input[type=time],input[type=number]{width:100%;padding:12px;border-radius:12px;border:1px solid #334155;background:var(--card);color:var(--tx);font-size:17px;text-align:center}
button{font:inherit;cursor:pointer}
.btn{padding:13px;border:0;border-radius:12px;background:var(--ac);color:#0f172a;font-weight:700;font-size:16px;width:100%;margin-top:8px}
.btn.red{background:var(--no);color:#fff}
.err{color:var(--no);min-height:22px}.okm{color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:center}
.top div{display:flex;gap:6px}
.out{background:none;border:1px solid #334155;color:var(--mut);border-radius:10px;padding:6px 12px}
.tabs{display:flex;gap:5px;margin:10px 0;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.tabs button{flex:1;padding:10px 2px;border-radius:10px;border:1px solid #334155;background:var(--card);color:var(--mut);font-size:13px}
.tabs button.on{background:var(--ac);color:#0f172a;border-color:var(--ac);font-weight:700}
.tabs.sub{position:static}
.day{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:2px solid transparent}
.day.today{border-color:var(--ac)}
.dn{font-weight:700;font-size:17px;margin-bottom:8px}.dn small{color:var(--mut);font-weight:400;margin-inline-start:6px}
.opts{display:flex;gap:8px}
.opt{flex:1;padding:10px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:var(--tx);font-size:16px}
.opt.p.on{background:var(--ok);color:#06210f;border-color:var(--ok);font-weight:700}
.opt.a.on{background:var(--no);color:#fff;border-color:var(--no);font-weight:700}
.times{display:flex;gap:8px;margin-top:10px}
.times label{flex:1;font-size:13px;color:var(--mut)}
.times input{margin-top:4px;padding:10px;font-size:16px}
.lv{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:16px}
.lv input{width:24px;height:24px;accent-color:var(--lv)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.sum div{background:var(--card);border-radius:12px;padding:10px 4px;text-align:center;font-size:12px;color:var(--mut)}
.sum b{display:block;font-size:20px;color:var(--tx)}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--card);border-radius:10px;margin-bottom:6px;font-size:15px;border-inline-start:5px solid #475569}
.row.p{border-color:var(--ok)}.row.a{border-color:var(--no)}.row.l{border-color:var(--lv)}
.row span:last-child{color:var(--mut);text-align:left;direction:ltr}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.ln{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #334155;font-size:15px}
.ln small{color:var(--mut);display:block;font-size:12px}
.ln b{white-space:nowrap}
.ln.tot{font-weight:700;border-bottom:0}
.pos{color:var(--ok)}.neg{color:var(--no)}
.net{background:var(--ac);color:#0f172a;border-radius:12px;padding:14px;display:flex;justify-content:space-between;font-size:19px;font-weight:700;margin-top:8px}
details.card summary{display:flex;justify-content:space-between;cursor:pointer;font-weight:700;list-style:none}
details.card summary::-webkit-details-marker{display:none}
.f{display:block;margin-bottom:10px;font-size:14px;color:var(--mut)}
.f input{margin-top:5px}
.auto{background:#0f172a;border:1px dashed #334155;border-radius:12px;padding:12px;margin-bottom:10px;font-size:14px;color:var(--mut);display:flex;justify-content:space-between}
.auto b{color:var(--tx)}
.note{color:var(--mut);font-size:13px;margin:6px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DK='att_data',SK='att_session',CK='att_code',ST='att_sal',SN='att_snap';
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let data=ld(DK,{}),sal=ld(ST,{}),snap=ld(SN,{}),tab='cur',stab='m';
const p2=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>`${y}-${p2(m+1)}-${p2(d)}`;
const mk=(y,m)=>`${y}-${p2(m+1)}`;
const now=new Date(),CY=now.getFullYear(),CM=now.getMonth(),TD=now.getDate();
const pm=CM?[CY,CM-1]:[CY-1,11];
const $=s=>document.getElementById(s);
const num=v=>parseFloat(v)||0;
const fm=n=>(Math.round(n*100)/100).toLocaleString('en',{maximumFractionDigits:2});
const getCode=()=>{try{return localStorage.getItem(CK)||'MOOHI'}catch(e){return 'MOOHI'}};
function logged(){try{return localStorage.getItem(SK)==='1'}catch(e){return false}}
function syncSnap(){snap[mk(CY,CM)]=Object.assign({},sal);sv(SN,snap)}

function login(){
  $('app').innerHTML=`<div class="login"><div style="font-size:56px">🗓️</div><h1>سجل الحضور</h1>
  <input type="text" id="c" placeholder="رمز الدخول" autocomplete="off" autocapitalize="characters" dir="ltr">
  <div class="err" id="e"></div><button class="btn" id="go">دخول</button></div>`;
  const go=()=>{if($('c').value.trim().toUpperCase()===getCode().toUpperCase()){try{localStorage.setItem(SK,'1')}catch(e){}main()}else $('e').textContent='الرمز غير صحيح'};
  $('go').onclick=go;$('c').onkeydown=e=>{if(e.key==='Enter')go()};
}
function main(){
  $('app').innerHTML=`<div class="top"><h1>سجل الحضور</h1><div><button class="out" id="gs">⚙️ الإعدادات</button><button class="out" id="lo">خروج</button></div></div>
  <div class="tabs" id="tb"><button data-t="cur">الحضور</button><button data-t="rc">تقرير الحالي</button><button data-t="rp">تقرير الماضي</button><button data-t="sal">المرتب</button></div><div id="v"></div>`;
  $('lo').onclick=()=>{try{localStorage.removeItem(SK)}catch(e){}login()};
  $('gs').onclick=()=>{tab='gs';render()};
  document.querySelectorAll('#tb button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  render();
}
function render(){
  document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  scrollTo(0,0);
  if(tab==='cur')days();else if(tab==='gs')general();else if(tab==='sal')salary();else report(...(tab==='rc'?[CY,CM]:pm));
}
function days(){
  const n=new Date(CY,CM+1,0).getDate();let h=`<h1>${MN[CM]} ${CY}</h1>`;
  for(let d=1;d<=n;d++){
    const k=key(CY,CM,d),r=data[k]||{},wd=WD[new Date(CY,CM,d).getDay()];
    h+=`<div class="day${d===TD?' today':''}" data-k="${k}"><div class="dn">${d}<small>${wd}</small></div>
    <div class="opts"><button class="opt p${r.s==='p'?' on':''}" data-s="p">✅ حضور</button><button class="opt a${r.s==='a'?' on':''}" data-s="a">❌ غياب</button></div>`;
    if(r.s==='p')h+=`<div class="times"><label>وقت الدخول<input type="time" data-f="in" value="${r.in||''}"></label><label>وقت الخروج<input type="time" data-f="out" value="${r.out||''}"></label></div>`;
    if(r.s==='a')h+=`<label class="lv"><input type="checkbox" data-f="leave"${r.leave?' checked':''}>إجازة</label>`;
    h+='</div>';
  }
  $('v').innerHTML=h;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=b.closest('.day').dataset.k,s=b.dataset.s,r=data[k];
    if(r&&r.s===s)delete data[k];else data[k]={s};
    sv(DK,data);const y=scrollY;days();scrollTo(0,y);
  });
  document.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>{
    const k=i.closest('.day').dataset.k;data[k]=data[k]||{};
    data[k][i.dataset.f]=i.type==='checkbox'?i.checked:i.value;sv(DK,data);
  });
}
function hrs(a,b){if(!a||!b)return 0;const[x,y]=a.split(':').map(Number),[z,w]=b.split(':').map(Number);let m=(z*60+w)-(x*60+y);if(m<0)m+=1440;return m}
function counts(y,m){
  const n=new Date(y,m+1,0).getDate();let P=0,A=0,L=0,T=0;
  for(let d=1;d<=n;d++){const r=data[key(y,m,d)];if(!r)continue;
    if(r.s==='p'){P++;T+=hrs(r.in,r.out)}else if(r.s==='a'){r.leave?L++:A++}}
  return{P,A,L,T,n};
}
function report(y,m){
  const c=counts(y,m);let rows='';
  for(let d=1;d<=c.n;d++){
    const r=data[key(y,m,d)],wd=WD[new Date(y,m,d).getDay()];let cl='',t='لم يُسجَّل',x='';
    if(r&&r.s==='p'){cl='p';t='حضور';const mm=hrs(r.in,r.out);x=(r.in||'--')+' → '+(r.out||'--')+(mm?` (${Math.floor(mm/60)}س ${mm%60}د)`:'')}
    else if(r&&r.s==='a'){if(r.leave){cl='l';t='إجازة'}else{cl='a';t='غياب'}}
    rows+=`<div class="row ${cl}"><span>${d} ${wd} — ${t}</span><span>${x}</span></div>`;
  }
  $('v').innerHTML=`<h1>تقرير ${MN[m]} ${y}</h1><div class="sum"><div><b>${c.P}</b>حضور</div><div><b>${c.A}</b>غياب</div><div><b>${c.L}</b>إجازة</div><div><b>${Math.floor(c.T/60)}:${p2(c.T%60)}</b>ساعات</div></div>${rows}`;
}

/* ====== المرتب ====== */
function calc(y,m){
  const c=counts(y,m),s=snap[mk(y,m)]||sal;
  const basic=num(s.basic),prod=num(s.prod),field=num(s.field),ot=basic/105/2,abs=basic/30.416;
  const fieldT=field*c.P,otT=ot*c.P,income=basic+prod+fieldT+otT;
  const pct=num(s.pct),pctT=income*pct/100,absT=abs*c.A,comp=num(s.comp),eid=num(s.eid);
  const ded=pctT+absT+comp+eid;
  return{c,basic,prod,field,fieldT,ot,otT,income,pct,pctT,abs,absT,comp,eid,ded,net:income-ded};
}
const L=(a,b,cls,sub)=>`<div class="ln"><span>${a}${sub?`<small>${sub}</small>`:''}</span><b class="${cls||''}">${b}</b></div>`;
function detail(r){
  return `<h2 style="margin-top:4px">الدخل</h2>
  ${L('المرتب الأساسي',fm(r.basic))}${L('الإنتاجية',fm(r.prod))}
  ${L('الحقلية',fm(r.fieldT),'',`${fm(r.field)} × ${r.c.P} يوم حضور`)}
  ${L('الإضافي',fm(r.otT),'',`${fm(r.ot)} × ${r.c.P} يوم حضور`)}
  ${L('إجمالي الدخل',fm(r.income),'pos').replace('class="ln"','class="ln tot"')}
  <h2>الخصميات</h2>
  ${L('نسبة الخصميات',fm(r.pctT),'',`${fm(r.pct)}% من إجمالي الدخل`)}
  ${L('غياب بدون إذن',fm(r.absT),'',`${fm(r.abs)} × ${r.c.A} يوم غياب`)}
  ${L('سلفة الشركة',fm(r.comp))}${L('سلفة العيد',fm(r.eid))}
  ${L('إجمالي الخصميات',fm(r.ded),'neg').replace('class="ln"','class="ln tot"')}
  <div class="net"><span>الصافي</span><span>${fm(r.net)}</span></div>`;
}
function salary(){
  $('v').innerHTML=`<div class="tabs sub" id="st"><button data-s="m">مرتب الشهر</button><button data-s="h">سجل المرتب</button><button data-s="s">إعدادات المرتب</button></div><div id="sv"></div>`;
  document.querySelectorAll('#st button').forEach(b=>{b.classList.toggle('on',b.dataset.s===stab);b.onclick=()=>{stab=b.dataset.s;salary()}});
  const o=$('sv');
  if(stab==='m'){
    const r=calc(CY,CM);
    o.innerHTML=`<h1>مرتب ${MN[CM]} ${CY}</h1><div class="sum"><div><b>${r.c.P}</b>حضور</div><div><b>${r.c.A}</b>غياب</div><div><b>${r.c.L}</b>إجازة</div><div><b>${fm(r.net)}</b>الصافي</div></div><div class="card">${detail(r)}</div><div class="note">الحساب حتى اليوم حسب ما سُجِّل من أيام الحضور والغياب.</div>`;
  }else if(stab==='h'){
    const set=new Set(Object.keys(data).map(k=>k.slice(0,7)));set.add(mk(CY,CM));
    const ms=[...set].sort().reverse();
    o.innerHTML=`<h1>سجل المرتب</h1>`+ms.map(s=>{const[y,m]=s.split('-').map(Number),r=calc(y,m-1);
      return `<details class="card"><summary><span>${MN[m-1]} ${y}</span><span class="pos">${fm(r.net)}</span></summary><div style="margin-top:8px"><div class="note">حضور ${r.c.P} • غياب ${r.c.A} • إجازة ${r.c.L}</div>${detail(r)}</div></details>`}).join('');
  }else{
    o.innerHTML=`<h1>إعدادات المرتب</h1>
    <h2>الدخل</h2>
    <label class="f">المرتب الأساسي<input type="number" inputmode="decimal" id="basic" value="${sal.basic||''}"></label>
    <label class="f">الحقلية (لليوم)<input type="number" inputmode="decimal" id="field" value="${sal.field||''}"></label>
    <label class="f">الإنتاجية<input type="number" inputmode="decimal" id="prod" value="${sal.prod||''}"></label>
    <div class="auto"><span>الإضافي (الأساسي ÷ 105 ÷ 2) لليوم</span><b id="aot"></b></div>
    <h2>الخصميات</h2>
    <label class="f">نسبة الخصميات % (من إجمالي الدخل)<input type="number" inputmode="decimal" id="pct" value="${sal.pct||''}"></label>
    <div class="auto"><span>غياب بدون إذن (الأساسي ÷ 30.416) لليوم</span><b id="aab"></b></div>
    <label class="f">سلفة العيد (اختياري)<input type="number" inputmode="decimal" id="eid" value="${sal.eid||''}"></label>
    <label class="f">سلفة الشركة (اختياري)<input type="number" inputmode="decimal" id="comp" value="${sal.comp||''}"></label>
    <div class="note okm" id="saved">يُحفظ تلقائياً</div>
    <div class="note">التعديل يسري على الشهر الحالي، والأشهر السابقة تبقى بإعداداتها وقت ذلك الشهر.</div>`;
    const upd=()=>{const b=num($('basic').value);$("aot").textContent=fm(b/105/2);$('aab').textContent=fm(b/30.416)};upd();
    ['basic','field','prod','pct','eid','comp'].forEach(id=>$(id).oninput=()=>{sal[id]=num($(id).value);sv(ST,sal);syncSnap();upd()});
  }
}

/* ====== الإعدادات العامة ====== */
function general(){
  $('v').innerHTML=`<h1>⚙️ الإعدادات</h1>
  <div class="card"><h2 style="margin-top:0">تغيير رمز الدخول</h2>
  <input type="text" id="nc" placeholder="الرمز الجديد" dir="ltr" autocapitalize="characters">
  <button class="btn" id="sc">حفظ الرمز</button><div class="note" id="m1"></div></div>
  <div class="card"><h2 style="margin-top:0">نسخة احتياطية</h2>
  <div class="note">البيانات محفوظة على هذا الهاتف فقط. احتفظ بنسخة احتياطية.</div>
  <button class="btn" id="ex">تصدير البيانات</button>
  <button class="btn" id="im">استيراد نسخة</button><input type="file" id="fi" accept=".json" class="hide" style="display:none"><div class="note" id="m2"></div></div>
  <div class="card"><h2 style="margin-top:0">حذف كل البيانات</h2><button class="btn red" id="rs">حذف الكل</button></div>`;
  $('sc').onclick=()=>{const v=$('nc').value.trim();if(v.length<3){$('m1').textContent='الرمز قصير';return}try{localStorage.setItem(CK,v)}catch(e){}$('m1').textContent='تم الحفظ ✔';$('m1').className='note okm';$('nc').value=''};
  $('ex').onclick=()=>{const b=new Blob([JSON.stringify({data,sal,snap})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='attendance-backup.json';a.click()};
  $('im').onclick=()=>$('fi').click();
  $('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);data=j.data||{};sal=j.sal||{};snap=j.snap||{};sv(DK,data);sv(ST,sal);sv(SN,snap);$('m2').textContent='تم الاستيراد ✔';$('m2').className='note okm'}catch(x){$('m2').textContent='ملف غير صالح'}};r.readAsText(f)};
  $('rs').onclick=()=>{if(confirm('سيتم حذف كل البيانات نهائياً. متأكد؟')){data={};sal={};snap={};sv(DK,data);sv(ST,sal);sv(SN,snap);tab='cur';render()}};
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
if(!snap[mk(CY,CM)]&&Object.keys(sal).length)syncSnap();
logged()?main():login();
</script>
</body>
</html>
